name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run verification tests
        run: npm test

      - name: Build client assets
        run: npm run desktop:build

      - name: Package Windows installers and portable executables
        run: npx electron-builder --win nsis msi portable

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Get-ChildItem -Path dist-desktop -Include "*.exe","*.msi" -Recurse | ForEach-Object {
            Write-Host "Found artifact: $($_.FullName)"
            if ($_.Name -like "*Setup*") {
              Copy-Item -Path $_.FullName -Destination "dist-desktop/hengji-Setup-$ver.exe" -Force
            } elseif ($_.Name -like "*.msi") {
              Copy-Item -Path $_.FullName -Destination "dist-desktop/hengji-$ver.msi" -Force
            } elseif ($_.Name -like "*$ver.exe*" -or $_.Name -like "*portable*") {
              Copy-Item -Path $_.FullName -Destination "dist-desktop/hengji-$ver.exe" -Force
              Copy-Item -Path $_.FullName -Destination "dist-desktop/hengji-portable.exe" -Force
            }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
